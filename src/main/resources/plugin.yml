name: TrueCombat
version: 2.2.0
main: ru.truwlf.truecombat.TrueCombatPlugin
api-version: '1.20'
folia-supported: true
author: TrueWulf
description: Fast, lightweight combat protection for Bukkit-compatible Minecraft servers.
commands:
  truecombat:
    description: Manage TrueCombat.
    aliases: [tc]
    permission: truecombat.admin
permissions:
  truecombat.admin:
    default: op
  truecombat.bypass:
    default: false
