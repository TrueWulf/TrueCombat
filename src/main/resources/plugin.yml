name: TrueCombat
version: 2.3.2
main: ru.truwlf.truecombat.TrueCombatPlugin
api-version: '1.20'
folia-supported: true
author: TrueWulf
description: Fast, lightweight combat protection for Bukkit-compatible Minecraft servers.
commands:
  truecombat:
    description: Manage TrueCombat.
    aliases: [tc]
permissions:
  truecombat.admin:
    default: op
    children:
      truecombat.admin.reload: true
      truecombat.admin.status: true
      truecombat.admin.combat: true
      truecombat.admin.debug: true
  truecombat.admin.reload:
    default: op
  truecombat.admin.status:
    default: op
  truecombat.admin.combat:
    default: op
  truecombat.admin.debug:
    default: op
  truecombat.bypass:
    default: false
